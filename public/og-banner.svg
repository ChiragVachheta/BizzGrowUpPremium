    <path d="M60 24l6.75 17.625L84 48l-17.25 6.375L60 72l-6.75-17.625L36 48l17.25-6.375L60 24z" fill="#070a12"/>
    <circle cx="92" cy="88" r="8" fill="#070a12" opacity="0.55"/>
  </g>

